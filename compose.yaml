services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder_local
      POSTGRES_DB: jobfinder
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jobfinder-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:0.16.2
    command:
      - /usr/bin/pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --url=postgres://jobfinder:jobfinder_local@postgres:5432/jobfinder?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jobfinder-postgres:
